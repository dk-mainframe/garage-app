<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Garage</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Garage">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000; --card: #232326; --well: #323238; --line: #36363C; --sel: #3E3E45;
    --text: #F5F5F7; --soft: #D6D6DC; --muted: #A8A8B0; --faint: #8E8E96;
    --amber: #F5A524; --amber-ink: #3B2A06; --blue: #7DB3FF; --red: #FF8A7A;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* The app never slides sideways, bounces, or zooms; long screens still scroll up and down. */
  html, body { margin: 0; background: var(--bg); color: var(--text); width: 100%; overflow-x: hidden; overscroll-behavior: none; }
  body { touch-action: pan-y; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  .chips { touch-action: pan-x; }
  body { font-family: 'Sora', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .screen { min-height: 100dvh; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px;
    padding: calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 24px); }
  .row { display: flex; align-items: center; gap: 12px; }
  .between { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .grow { flex-grow: 1; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -.02em; }
  .sub { font-size: 15px; color: var(--muted); }
  .card { background: var(--card); border-radius: 20px; }
  .iconbtn { width: 44px; height: 44px; border-radius: 22px; border: 0; background: var(--card); color: var(--text);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .crumb { font-size: 15px; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .seg { display: grid; grid-auto-columns: minmax(0, 1fr); grid-auto-flow: column; gap: 4px; background: var(--card); border-radius: 14px; padding: 4px; }
  .seg button { height: 44px; border: 0; border-radius: 11px; background: transparent; color: var(--muted); font-size: 15px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; gap: 8px; }
  .seg button[aria-pressed="true"] { background: var(--sel); color: var(--text); }
  .digits { display: flex; gap: 3px; align-items: flex-end; }
  .digits span { width: 20px; height: 28px; border-radius: 5px; background: #000; border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; }
  .digits span.lit { border-color: var(--amber); color: var(--amber); }
  .big { text-decoration: none; border-radius: 28px; padding: 22px 24px; display: flex; flex-direction: column; gap: 24px; border: 0; text-align: left; width: 100%; }
  .big.amber { background: var(--amber); color: #000; box-shadow: 0 10px 36px rgba(245,165,36,.38); }
  .big.blue { background: var(--blue); color: #000; box-shadow: 0 10px 36px rgba(125,179,255,.32); }
  .big.dark { background: var(--card); color: var(--text); border: 1px solid var(--line); }
  .big .well { width: 56px; height: 56px; border-radius: 18px; display: flex; align-items: center; justify-content: center; }
  .big.amber .well, .big.blue .well { background: rgba(0,0,0,.12); }
  .big.dark .well { background: var(--well); }
  .big .title { font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
  .big .desc { font-size: 14px; font-weight: 500; margin-top: 4px; }
  .big.amber .desc { color: var(--amber-ink); }
  .big.dark .desc { color: var(--muted); }
  .pill { font-size: 11px; font-weight: 700; border-radius: 9px; padding: 3px 8px; letter-spacing: .02em; }
  .bar { text-decoration: none; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 24px; height: 84px; padding: 0 20px;
    display: flex; align-items: center; gap: 16px; width: 100%; }
  .bar .well { width: 48px; height: 48px; border-radius: 16px; background: var(--well); display: flex; align-items: center; justify-content: center; }
  .line { display: flex; justify-content: space-between; font-size: 13px; gap: 8px; }
  .line span:first-child { color: var(--soft); }
  .over { color: var(--red); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .soon { color: var(--amber); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .link { background: none; border: 0; color: var(--amber); font-size: 14px; font-weight: 600; height: 44px; display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 13px; font-weight: 600; color: var(--muted); padding-left: 6px; }
  .field input { height: 58px; width: 100%; border: 1px solid var(--line); border-radius: 16px; background: var(--card); color: var(--text);
    font-size: 22px; font-weight: 600; padding: 0 18px; outline: none; }
  .field input:focus { border-color: var(--amber); }
  .field input.bad { border-color: var(--red); color: var(--red); }
  .field input::placeholder { color: var(--faint); }
  .field.small input { height: 48px; font-size: 16px; font-weight: 500; }
  .primary { height: 60px; border: 0; border-radius: 30px; background: var(--amber); color: #000; font-size: 18px; font-weight: 700; width: 100%;
    box-shadow: 0 10px 36px rgba(245,165,36,.38); }
  .primary:disabled { opacity: .5; box-shadow: none; }
  .secondary { height: 56px; border: 1px solid var(--line); border-radius: 28px; background: var(--card); color: var(--text); font-size: 16px; font-weight: 600; width: 100%; }
  .warn { background: #2A1A17; border: 1px solid #5C2E26; border-radius: 20px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; }
  .warn b { font-size: 15px; display: block; margin-bottom: 4px; }
  .warn span { font-size: 13px; color: var(--soft); line-height: 1.45; }
  .list .item { padding: 13px 16px; border-bottom: 1px solid #2E2E33; display: flex; gap: 12px; align-items: flex-start; }
  .list .item:last-child { border-bottom: 0; }
  .dot { width: 8px; height: 8px; border-radius: 4px; margin-top: 7px; flex-shrink: 0; }
  .tip { font-size: 12px; font-style: italic; color: var(--muted); line-height: 1.45; }
  .section { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; padding: 6px 6px 0; }
  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24px); transform: translateX(-50%); background: var(--sel); color: var(--text);
    padding: 12px 18px; border-radius: 16px; font-size: 14px; font-weight: 500; max-width: 90vw; z-index: 10; }
  .chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -20px; padding: 2px 20px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { flex-shrink: 0; height: 44px; padding: 0 16px; border: 1px solid var(--line); border-radius: 22px; background: var(--card); color: var(--muted);
    font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .chips button[aria-pressed="true"] { background: var(--sel); color: var(--text); border-color: var(--sel); }
  .group { background: var(--card); border-radius: 20px; padding: 6px 16px; }
  .group .gi { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid #2E2E33; }
  .group .gi:last-child { border-bottom: 0; }
  .group .gi > span:first-child { font-size: 15px; color: var(--soft); }
  .group input, .group select, .group textarea { background: #000; border: 1px solid var(--line); border-radius: 10px; color: var(--text); font-size: 16px; padding: 8px 10px; outline: none; }
  .group input:focus, .group select:focus, .group textarea:focus { border-color: var(--amber); }
  .group input.n { width: 110px; text-align: right; }
  .group textarea { width: 100%; resize: vertical; min-height: 64px; font-family: inherit; margin: 10px 0; }
  .switch { position: relative; width: 52px; height: 32px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 52px; height: 32px; margin: 0; position: absolute; inset: 0; cursor: pointer; }
  .switch span { position: absolute; inset: 0; border-radius: 16px; background: var(--line); transition: background .2s; pointer-events: none; }
  .switch span::after { content: ''; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 13px; background: #fff; transition: transform .2s; }
  .switch input:checked + span { background: var(--amber); }
  .switch input:checked + span::after { transform: translateX(20px); }
  .mini { height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--line); background: transparent; color: var(--soft); font-size: 13px; font-weight: 600; }
  .note { font-size: 13px; color: var(--muted); line-height: 1.5; padding: 0 6px; }
  .rv { padding: 12px 0; border-bottom: 1px solid #2E2E33; display: flex; flex-direction: column; gap: 8px; }
  .rv:last-child { border-bottom: 0; }
  .rv .ins { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
  .rv .ins input { width: 92px; text-align: right; }
  .rv.changed .ins input { border-color: var(--amber); }
  .itembtn { all: unset; display: flex; gap: 12px; align-items: flex-start; padding: 13px 16px; border-bottom: 1px solid #2E2E33; cursor: pointer; }
  .itembtn:last-child { border-bottom: 0; }
  .itembtn:focus-visible { outline: 2px solid var(--amber); outline-offset: -2px; }
  .center { text-align: center; }
  .xbtn { width: 36px; height: 36px; border-radius: 18px; border: 1px solid var(--line); background: transparent; color: var(--muted); display: flex; align-items: center; justify-content: center; flex-shrink: 0; padding: 0; }
  .updating { font-size: 11px; letter-spacing: .04em; text-transform: none; color: var(--faint); font-weight: 500; animation: fade 1.2s ease-in-out infinite alternate; }
  @keyframes fade { from { opacity: .45; } to { opacity: 1; } }
  .banner { position: sticky; top: calc(env(safe-area-inset-top) + 8px); z-index: 20; box-shadow: 0 12px 30px rgba(0,0,0,.7); display: flex; align-items: center; gap: 12px; padding: 12px 10px 12px 14px; border-radius: 18px; background: #16261A; border: 1px solid #2F6B3E;
    animation: drop .35s cubic-bezier(.2,1.2,.4,1); }
  .banner.fail { background: #2A1A17; border-color: #5C2E26; }
  .banner .bicon { width: 32px; height: 32px; border-radius: 16px; background: #5BD27A; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .banner.fail .bicon { background: var(--red); }
  .banner b { display: block; font-size: 15px; }
  .banner .grow > span { display: block; font-size: 12px; color: var(--soft); margin-top: 2px; }
  .banner .bclose { width: 36px; height: 36px; border: 0; border-radius: 18px; background: transparent; color: var(--muted); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  @keyframes drop { from { transform: translateY(-16px); opacity: 0; } to { transform: none; opacity: 1; } }
  button.ok { background: #5BD27A !important; color: #000 !important; border-color: #5BD27A !important; box-shadow: none !important; }
  #statsBody { display: flex; flex-direction: column; gap: 16px; }
  .spin { width: 28px; height: 28px; border-radius: 14px; border: 3px solid var(--line); border-top-color: var(--amber); animation: s 0.8s linear infinite; margin: 40vh auto 0; }
  @keyframes s { to { transform: rotate(360deg); } }
  .pop { animation: pop .45s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>
<main id="app"><div class="spin" role="status" aria-label="Loading"></div></main>
<script>
  // iPhone ignores some zoom settings, so block pinch zoom directly (touch-action handles double-tap).
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, e => e.preventDefault()));
</script>
<script src="checks.js"></script>
<script src="media.js"></script>
<script src="stats.js"></script>
<script src="app.js"></script>
</body>
</html>
